# Values for the oan-farmer-app-service chart (helm/oan-farmer-app-service).
# Target: the QA RKE2 node (qa.oanstaging.com), the staging environment, installed by the Jenkins stage
# "staging → QA cluster (helm)" (ci/deploy-helm-dev.sh with DEPLOY_ENV=staging). Release `farmer-app`, namespace `farmer-app`.
#
# Set at install, not here:
# - frappe.image.tag: the staging version `<init.yaml version>-staging.<build>`, tagged on develop's image by `promote`

global:
  baseDomain: qa.oanstaging.com

frappe:
  image:
    # Jenkinsfile ECR_REPO. The node pulls from ECR with its IAM role (kubelet ecr-credential-provider).
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/oan-farmer-app-service/farmer-app-service

  # The shared PostgreSQL of the oan-frappe-common release (namespace frappe-common).
  dbHost: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  dbRootUser: postgres

  # The chart's pods drop every capability: the QA namespaces enforce the Pod Security `baseline` profile.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      add: []
      drop:
      - ALL

  nginx:
    environment:
      # The desk host (oan-farmer-app-gateway.yaml desk.host) is not the site name, so nginx names the site itself.
      frappeSiteNameHeader: farmer-app-service.qa.oanstaging.com
      # APISIX reaches nginx from the pod network: trust its X-Forwarded-For for the client address.
      upstreamRealIPAddress: 10.42.0.0/16
  persistence:
    worker:
      # ReadWriteMany from the NFS server.
      storageClass: nfs-csi

  siteConfig:
    values:
      host_name: https://farmer-app-service.qa.oanstaging.com
      # The backends the app forwards to (OAN Farmer App Settings reads `base_url` from here over its
      # own rows). https only. The *.qa.oanstaging.com names reach APISIX on the QA node, which serves A2C and
      # grievance itself (paths /v1/...) and passes the rest to the Istio ingress.
      oan_farmer_app_service:
        upstreams:
          a2c:
            base_url: https://a2c-service.qa.oanstaging.com
          grievance:
            base_url: https://grievance-service.qa.oanstaging.com
          consent:
            base_url: https://consent-manager.qa.oanstaging.com
          nmis:
            base_url: https://api.nmis.click/api

  jobs:
    configure:
      # nfs-csi creates each volume directory with mode 0777, so the Frappe user can write it.
      fixVolume: false
    createSite:
      siteName: farmer-app-service.qa.oanstaging.com
