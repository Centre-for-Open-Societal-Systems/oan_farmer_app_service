    app: oan-farmer-app
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  scheme: https
  passHost: rewrite
  upstreamHost: {{ required "grievance.host is required" .Values.grievance.host | quote }}
  retries: 0
