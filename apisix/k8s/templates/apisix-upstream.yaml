# change an endpoint in oan_farmer_app_service/api/v1 or TIERS and re-run.
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: {{ required "web.serviceName is required" .Values.web.serviceName | quote }}
  labels:
    app: oan-farmer-app
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  scheme: http
  passHost: rewrite
  upstreamHost: {{ required "siteName is required" .Values.siteName | quote }}
  retries: 2
  timeout:
    connect: 5s
    send: 20s
    read: 20s
