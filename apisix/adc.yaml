# Farmer app ADC config (adc lint|validate|diff|sync)
# Generated by generate_apisix_config.py -- do not hand-edit;
# change an endpoint in oan_farmer_app_service/api/v1 or TIERS and re-run.
services:
- name: oan-farmer-app-service-v1
  labels:
    app: oan-farmer-app
  upstream:
    scheme: http
    nodes:
    - host: ${OAN_FARMER_APP_UPSTREAM_HOST}
      port: 8000
      weight: 1
    pass_host: rewrite
    upstream_host: ${FRAPPE_SITE_NAME}
    timeout:
      connect: 5
      send: 20
      read: 20
    retries: 2
  plugins:
    cors:
      allow_origins: https://cors-by-regex-only.invalid
      allow_origins_by_regex:
      - ^(?:https?://localhost(:[0-9]+)?)$
      allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type,X-Request-Id,X-CSRF-Token
      allow_credential: false
      max_age: 3600
    client-control:
      max_body_size: 1048576
    proxy-rewrite:
      regex_uri:
      - ^/(.*)
      - /api/$1
  routes:
  - name: oan-farmer-app-auth-admin-bearer-delete
    description: Admin user and role management. Low volume. Keyed per IP while GATEWAY_JWT is off; per
      token once the gateway verifies tokens.
    labels:
      app: oan-farmer-app
      tier: auth-admin
      auth: bearer
    uris:
    - /v1/admin/permissions
    - /v1/admin/users/:user_id/roles/:role
    - /v1/admin/users/:user_id/sessions
    methods:
    - DELETE
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
        group: oan-farmer-app:auth-admin:bearer
  - name: oan-farmer-app-auth-admin-bearer-get
    description: Admin user and role management. Low volume. Keyed per IP while GATEWAY_JWT is off; per
      token once the gateway verifies tokens.
    labels:
      app: oan-farmer-app
      tier: auth-admin
      auth: bearer
    uris:
    - /v1/admin/permissions
    - /v1/admin/roles
    - /v1/admin/users
    - /v1/admin/users/:user_id
    - /v1/admin/users/:user_id/roles
    methods:
    - GET
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
        group: oan-farmer-app:auth-admin:bearer
  - name: oan-farmer-app-auth-admin-bearer-patch
    description: Admin user and role management. Low volume. Keyed per IP while GATEWAY_JWT is off; per
      token once the gateway verifies tokens.
    labels:
      app: oan-farmer-app
      tier: auth-admin
      auth: bearer
    uris:
    - /v1/admin/users/:user_id
    methods:
    - PATCH
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
